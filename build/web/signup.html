
<!DOCTYPE html>

<html>
    <head>
        <title>Sign Up </title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css ">
        <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
        <link rel="stylesheet" href="css/vendor/font-awesome.css">
        <link rel="stylesheet" href="css/vendor/flaticon/flaticon.css">
        <link rel="stylesheet" href="css/vendor/slick.css">
        <link rel="stylesheet" href="css/vendor/slick-theme.css">
        <link rel="stylesheet" href="css/vendor/jquery-ui.min.css">
        <link rel="stylesheet" href="css/vendor/magnific-popup.css">
        <link rel="stylesheet" href="css/vendor/base.css">
        <link rel="stylesheet" href="css/style.min.css">



        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Raleway, sans-serif;
            }

            body {
                background-color: #000;
            }

            .container {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            .screen {
                background-color: #000;
                position: relative;
                height: 600px;
                width: 360px;
                box-shadow: 0px 0px 24px #5C5696;
            }

            .screen__content {
                z-index: 1;
                position: relative;
                height: 100%;
            }

            .screen__background {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 0;
                -webkit-clip-path: inset(0 0 0 0);
            }

            .screen__background__shape {
                transform: rotate(45deg);
                position: absolute;
            }

            .screen__background__shape1 {
                height: 520px;
                width: 520px;
                background: #FFF;
                top: -50px;
                right: 120px;
                border-radius: 0 72px 0 0;
            }

            .screen__background__shape2 {
                height: 220px;
                width: 220px;
                background: linear-gradient(90deg, #8B0000, #450000);
                top: -172px;
                right: 0;
                border-radius: 32px;
            }

            .screen__background__shape3 {
                height: 540px;
                width: 190px;
                background: linear-gradient(90deg, #8B0000, #450000);
                top: -24px;
                right: 0;
                border-radius: 32px;
            }

            .screen__background__shape4 {
                height: 400px;
                width: 200px;
                background: linear-gradient(90deg, #8B0000, #450000);
                top: 420px;
                right: 50px;
                border-radius: 60px;
            }

            .login {
                width: 320px;
                padding: 30px;
                padding-top: 156px;
            }

            .signup {
                width: 320px;
                padding: 30px;
                padding-top: 156px;
            }

            .login__field {
                padding: 20px 0px;
                position: relative;
            }

            .login__icon {
                position: absolute;
                top: 30px;
                color: #7875B5;
            }

            .login__input {
                border: none;
                border-bottom: 2px solid #D1D1D4;
                background: none;
                padding: 10px;
                padding-left: 24px;
                font-weight: 700;
                width: 75%;
                transition: .2s;
            }

            .login__input:active,
            .login__input:focus,
            .login__input:hover {
                outline: none;
                border-bottom-color: #6A679E;
            }

            .login__submit {
                background: #fff;
                font-size: 14px;
                margin-top: 30px;
                padding: 16px 20px;
                border-radius: 26px;
                border: 1px solid #D4D3E8;
                text-transform: uppercase;
                font-weight: 700;
                display: flex;
                align-items: center;
                width: 100%;
                color: #4C489D;
                box-shadow: 0px 2px 2px #5C5696;
                cursor: pointer;
                transition: .2s;
            }

            .login__submit:active,
            .login__submit:focus,
            .login__submit:hover {
                border-color: #6A679E;
                outline: none;
            }

            .button__icon {
                font-size: 24px;
                margin-left: auto;
                color: #7875B5;
            }


        </style>
    </head>
    <body>

        <div class="d-flex justify-content-center align-items-center">
            <p class="text-danger" id="message"></p>
        </div>

        <div class="signin-header">
            <div class="row align-items-center justify-content-end"> <!-- Added justify-content-end -->
                <div class="col-md-6 text-end"> <!-- Added text-end to align content inside the column -->
                    <div class="singin-header-btn">
                        <p class="text-light">Already a member?</p>
                        <a href="signin.html" class="btn btn-danger sign-up-btn" style="font-size: 20px; padding: 15px 30px;">Sign In</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="screen">
                <div class="screen__content">
                    <div class="signup">
                        <div class="form-group">
                            <label>First Name</label>
                            <input id="firstName" type="text" class="form-control" value="">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input id="lastName" type="text" class="form-control" value="">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input id="email" type="email" class="form-control" value="">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input id="password" type="password" class="form-control" value="">
                        </div>
                        <button onclick="signUp(event);"  class="login__submit">
                            <span>Sign Up</span>
                        </button>				
                    </div>

                </div>
                <div class="screen__background">
                    <span class="screen__background__shape screen__background__shape4"></span>
                    <span class="screen__background__shape screen__background__shape3"></span>		
                    <span class="screen__background__shape screen__background__shape2"></span>
                    <span class="screen__background__shape screen__background__shape1"></span>
                </div>		
            </div>
        </div>

        <script src="js/sign-up.js"></script>
    </body>
</html>
